name: Validate deque slicing fix

on:
  push:
    branches:
      - audit/1018-deque-state-slicing

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Stone Soup and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run focused regression tests
        run: |
          pytest stonesoup/initiator/tests/test_wrapper.py stonesoup/types/tests/test_state.py
